name: Player Cards Store Build

# Offload long InStat PBP + card indexing from local machines.
# Auth: set INSTAT_X_AUTH_TOKEN + INSTAT_AUTHORIZATION repo secrets (API headers).
# Generate once locally: python scripts/print_instat_api_tokens.py
# Sharded matrix keeps each job under GitHub's 6h limit.

concurrency:
  group: player-cards-build
  cancel-in-progress: false

on:
  schedule:
    # Sunday 2:00 AM Central (07:00 UTC during CDT). ~3h build finishes by ~5 AM CT,
    # well before 7 AM CT. NHL shards 1-8 + PWHL shard 9.
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard id (1-9) or 'all'"
        required: false
        default: "all"
      teams:
        description: "Optional comma team list (overrides shard), e.g. UTA,PIT"
        required: false
        default: ""
      force:
        description: "Force rebuild even when no new NHL/PWHL games are detected"
        required: false
        default: "false"
        type: boolean
      seed_fingerprint_only:
        description: "Only compute/save data fingerprint (no auth/build). Use once after deploy."
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  actions: read

env:
  PLAYER_CARDS_WORK_ROOT: ${{ github.workspace }}/.player-cards-data
  PLAYER_CARDS_STORE: ${{ github.workspace }}/.player-cards-data/card_store.db
  SKIP_PHOTO_PREWARM: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      reason: ${{ steps.gate.outputs.reason }}
      summary: ${{ steps.gate.outputs.summary }}
      seed_only: ${{ steps.flags.outputs.seed_only }}
      matrix: ${{ steps.gate.outputs.matrix }}
      full_build: ${{ steps.gate.outputs.full_build }}
      full_nhl: ${{ steps.gate.outputs.full_nhl }}
      include_pwhl: ${{ steps.gate.outputs.include_pwhl }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve flags
        id: flags
        env:
          SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_fingerprint_only || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          echo "seed_only=$SEED" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "seed_only=$SEED force=$FORCE"

      - name: Restore previous data fingerprint
        uses: actions/cache/restore@v5
        with:
          path: .ci/data-fingerprint.json
          key: player-cards-data-fp-${{ github.run_id }}
          restore-keys: |
            player-cards-data-fp-

      - name: Check for new NHL / PWHL games
        id: gate
        env:
          FORCE: ${{ steps.flags.outputs.force }}
          SEED_ONLY: ${{ steps.flags.outputs.seed_only }}
        run: |
          mkdir -p .ci
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ] && [ "$SEED_ONLY" != "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/ci_check_player_cards_freshness.py \
            --previous .ci/data-fingerprint.json \
            --write-live .ci/live-fingerprint.json \
            --write-plan .ci/build-plan.json \
            $FORCE_FLAG
          if [ "$SEED_ONLY" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=seed_fingerprint_only" >> "$GITHUB_OUTPUT"
            echo "summary=seeded live fingerprint without rebuild" >> "$GITHUB_OUTPUT"
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "full_nhl=false" >> "$GITHUB_OUTPUT"
            echo "include_pwhl=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload live fingerprint
        uses: actions/upload-artifact@v5
        with:
          name: live-data-fingerprint
          path: |
            .ci/live-fingerprint.json
            .ci/build-plan.json
          retention-days: 30

  seed-fingerprint:
    needs: check
    if: needs.check.outputs.seed_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download live fingerprint
        uses: actions/download-artifact@v5
        with:
          name: live-data-fingerprint
          path: .ci

      - name: Canonicalize fingerprint path
        run: |
          cp .ci/live-fingerprint.json .ci/data-fingerprint.json
          cat .ci/data-fingerprint.json

      - name: Persist fingerprint for next scheduled run
        uses: actions/cache/save@v5
        with:
          path: .ci/data-fingerprint.json
          key: player-cards-data-fp-${{ github.run_id }}

      - name: Upload data fingerprint artifact
        uses: actions/upload-artifact@v5
        with:
          name: data-fingerprint
          path: .ci/data-fingerprint.json
          retention-days: 90

  plan:
    needs: check
    if: needs.check.outputs.should_build == 'true' && needs.check.outputs.seed_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.set.outputs.full_build }}
      full_nhl: ${{ steps.set.outputs.full_nhl }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build plan
        uses: actions/download-artifact@v5
        with:
          name: live-data-fingerprint
          path: .ci

      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARD: ${{ github.event.inputs.shard }}
          TEAMS: ${{ github.event.inputs.teams }}
          CHECK_MATRIX: ${{ needs.check.outputs.matrix }}
          CHECK_FULL: ${{ needs.check.outputs.full_build }}
          CHECK_FULL_NHL: ${{ needs.check.outputs.full_nhl }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          shard = (os.environ.get("SHARD") or "").strip()
          teams = (os.environ.get("TEAMS") or "").strip()
          event = os.environ.get("EVENT_NAME") or ""

          plan_path = Path(".ci/build-plan.json")
          plan = json.loads(plan_path.read_text()) if plan_path.is_file() else {}
          selected = list((plan.get("matrix") or {}).get("include") or [])
          full = bool(plan.get("full_build"))
          full_nhl = bool(plan.get("full_nhl"))

          # Manual overrides: explicit team list or single shard.
          all_shards = [
              {"shard_id": 1, "teams": "ANA,BOS,BUF,CGY", "league": "nhl"},
              {"shard_id": 2, "teams": "CAR,CBJ,CHI,COL", "league": "nhl"},
              {"shard_id": 3, "teams": "DAL,DET,EDM,FLA", "league": "nhl"},
              {"shard_id": 4, "teams": "LAK,MIN,MTL,NJD", "league": "nhl"},
              {"shard_id": 5, "teams": "NSH,NYI,NYR,OTT", "league": "nhl"},
              {"shard_id": 6, "teams": "PHI,PIT,SEA,SJS", "league": "nhl"},
              {"shard_id": 7, "teams": "STL,TBL,TOR,UTA", "league": "nhl"},
              {"shard_id": 8, "teams": "VAN,VGK,WPG,WSH", "league": "nhl"},
              {"shard_id": 9, "teams": "BPF,MNF,MVL,NYS,OTC,TSR", "league": "pwhl"},
          ]
          if teams:
              want = {t.strip().upper() for t in teams.split(",") if t.strip()}
              selected = []
              for s in all_shards:
                  hit = [t for t in s["teams"].split(",") if t in want]
                  if hit:
                      selected.append({**s, "teams": ",".join(hit)})
              full = False
              full_nhl = False
          elif shard and shard not in ("", "all"):
              try:
                  want_id = int(shard)
              except ValueError:
                  raise SystemExit(f"Invalid shard {shard!r}; use 1-9 or all")
              selected = [s for s in all_shards if s["shard_id"] == want_id]
              if not selected:
                  raise SystemExit(f"Unknown shard {want_id}; use 1-9 or all")
              # Manual shard: still drop inactive PWHL unless forced via shard=9
              if want_id == 9 and not plan.get("pwhl_season_active") and event == "schedule":
                  selected = []
              full = False
              full_nhl = want_id != 9 and len(selected) == 8

          if not selected:
              raise SystemExit("Build plan has no dirty teams/shards — nothing to run")

          matrix = {"include": selected}
          print(f"event={event} shard={shard!r} teams={teams!r} full_build={full} full_nhl={full_nhl}")
          print("matrix", json.dumps(matrix))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"full_build={'true' if full else 'false'}\n")
              fh.write(f"full_nhl={'true' if full_nhl else 'false'}\n")
              fh.write("matrix<<MATRIX\n")
              fh.write(json.dumps(matrix, separators=(",", ":")))
              fh.write("\nMATRIX\n")
          PY

  auth:
    needs: [check, plan]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      auth_ok: ${{ steps.auth.outputs.auth_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            player_cards/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r player_cards/requirements.txt
          python -m playwright install chromium || \
            timeout 180 python -m playwright install --with-deps chromium

      - name: Obtain InStat Auth Tokens
        id: auth
        env:
          INSTAT_X_AUTH_TOKEN: ${{ secrets.INSTAT_X_AUTH_TOKEN }}
          INSTAT_AUTHORIZATION: ${{ secrets.INSTAT_AUTHORIZATION }}
          INSTAT_AUTH_JSON: ${{ secrets.INSTAT_AUTH_JSON }}
          HUDL_USERNAME: ${{ secrets.HUDL_USERNAME }}
          HUDL_PASSWORD: ${{ secrets.HUDL_PASSWORD }}
          INSTAT_DEDICATED_ACCOUNT: "1"
          ALLOW_INSTAT_LOGIN: "1"
          DISABLE_AUTO_LOGIN: "0"
        run: |
          python scripts/ci_instat_auth.py

      - name: Upload InStat auth artifact
        uses: actions/upload-artifact@v5
        with:
          name: instat-auth-session
          path: instat_auth_session/
          retention-days: 1

  build-shard:
    needs: [check, plan, auth]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            player_cards/requirements.txt

      - name: Download InStat auth artifact
        uses: actions/download-artifact@v5
        with:
          name: instat-auth-session
          path: instat_auth_session

      - name: Configure InStat auth
        run: |
          mkdir -p ~/.cache/player-cards hudl-scraping
          if [ -f instat_auth_session/instat_headers_cache.json ]; then
            cp instat_auth_session/instat_headers_cache.json ~/.cache/player-cards/instat_headers_cache.json
          fi
          if [ -f instat_auth_session/auth.json ]; then
            cp instat_auth_session/auth.json auth.json
            cp instat_auth_session/auth.json hudl-scraping/auth.json
          fi
          echo "Restored verified InStat auth session from auth job"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r player_cards/requirements.txt
          # ubuntu-24.04 runners have all Playwright system deps pre-installed.
          # Try without --with-deps first; fall back with a 3-min timeout to
          # avoid hanging on transient Azure apt mirror outages.
          python -m playwright install chromium || \
            timeout 180 python -m playwright install --with-deps chromium

      - name: Resolve team list
        id: teams
        env:
          INPUT_TEAMS: ${{ github.event.inputs.teams }}
          SHARD_TEAMS: ${{ matrix.teams }}
          SHARD_LEAGUE: ${{ matrix.league }}
        run: |
          if [ -n "$INPUT_TEAMS" ]; then
            TEAMS="$INPUT_TEAMS"
            LEAGUE="nhl"
            if echo ",$INPUT_TEAMS," | grep -qiE ',(BPF|MNF|MVL|NYS|OTC|TSR|STT|VGE),'; then
              LEAGUE="pwhl"
            fi
          else
            TEAMS="$SHARD_TEAMS"
            LEAGUE="${SHARD_LEAGUE:-nhl}"
          fi
          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"
          echo "league=$LEAGUE" >> "$GITHUB_OUTPUT"
          echo "Building shard ${{ matrix.shard_id }}: league=$LEAGUE teams=$TEAMS"

      - name: Restore PBP cache
        uses: actions/cache@v5
        with:
          path: .player-cards-data
          key: player-cards-pbp-${{ matrix.shard_id }}-${{ hashFiles('player_cards/leagues.py', 'player_cards/instat_source.py', 'player_cards/instat_pbp_fetch.py', 'player_cards/build_store.py') }}
          restore-keys: |
            player-cards-pbp-${{ matrix.shard_id }}-

      - name: Build card store shard
        working-directory: hudl-scraping
        env:
          PYTHONPATH: ${{ github.workspace }}
          INSTAT_AUTH_FILE: ${{ github.workspace }}/hudl-scraping/auth.json
          HUDL_USERNAME: ${{ secrets.HUDL_USERNAME }}
          HUDL_PASSWORD: ${{ secrets.HUDL_PASSWORD }}
          INSTAT_DEDICATED_ACCOUNT: "0"
          ALLOW_INSTAT_LOGIN: "0"
          DISABLE_AUTO_LOGIN: "1"
          PLAYER_CARDS_WORK_ROOT: ${{ github.workspace }}/.player-cards-data
          PLAYER_CARDS_STORE: ${{ github.workspace }}/.player-cards-data/shards/card_store_${{ matrix.shard_id }}.db
        run: |
          mkdir -p "$PLAYER_CARDS_WORK_ROOT/shards"
          python -m player_cards.build_store \
            --league "${{ steps.teams.outputs.league }}" \
            --teams "${{ steps.teams.outputs.teams }}" \
            --store "$PLAYER_CARDS_STORE" \
            -v

      - name: Upload shard store
        uses: actions/upload-artifact@v5
        with:
          name: card-store-shard-${{ matrix.shard_id }}
          if-no-files-found: error
          retention-days: 30
          path: .player-cards-data/shards/card_store_${{ matrix.shard_id }}.db

      - name: Package PBP cache for upload
        id: pbp_pack
        run: |
          if [ ! -d .player-cards-data ]; then
            echo "No .player-cards-data directory" >&2
            exit 1
          fi
          count=$(find .player-cards-data -path '*/Instat_API_Downloads/*_pbp.csv' | wc -l)
          echo "PBP CSV files on disk: $count"
          if [ "$count" -lt 1 ]; then
            # Early-season / offseason shards (esp. PWHL before Nov/Dec) may have
            # a store but no fresh PBP yet — do not fail the whole build.
            echo "No PBP CSV files to upload (skipping pbp-cache artifact)"
            echo "has_pbp=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "pbp-cache-shard-${{ matrix.shard_id }}.tar.gz" \
            --exclude='./shards' \
            --exclude='*.db' \
            -C .player-cards-data .
          echo "has_pbp=true" >> "$GITHUB_OUTPUT"

      - name: Upload PBP cache snapshot
        if: steps.pbp_pack.outputs.has_pbp == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: pbp-cache-shard-${{ matrix.shard_id }}
          if-no-files-found: warn
          retention-days: 14
          path: pbp-cache-shard-${{ matrix.shard_id }}.tar.gz
          compression-level: 0

  merge:
    needs: [check, plan, build-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.check.outputs.should_build == 'true' && needs.build-shard.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore previous merged store
        uses: actions/cache/restore@v5
        with:
          path: .player-cards-data/card_store.prev.db
          key: player-cards-merged-${{ github.run_id }}
          restore-keys: |
            player-cards-merged-

      - name: Fetch previous merged store artifact if cache miss
        if: needs.plan.outputs.full_nhl != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .player-cards-data
          if [ -f .player-cards-data/card_store.prev.db ]; then
            echo "Using cached previous merged store"
            exit 0
          fi
          # Last successful workflow run that published card-store-merged
          RUN_ID=$(gh run list \
            --workflow "Player Cards Store Build" \
            --branch "${{ github.ref_name }}" \
            --limit 20 \
            --json databaseId,conclusion,status \
            --jq '.[] | select(.conclusion=="success" and .status=="completed") | .databaseId' \
            | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: incremental rebuild needs a prior merged store (cache + artifact miss). Re-run once with force=true." >&2
            exit 1
          fi
          echo "Downloading card-store-merged from run $RUN_ID"
          gh run download "$RUN_ID" -n card-store-merged -D .player-cards-data/prev-art
          if [ -f .player-cards-data/prev-art/card_store.db ]; then
            cp .player-cards-data/prev-art/card_store.db .player-cards-data/card_store.prev.db
          else
            echo "ERROR: prior run $RUN_ID had no card_store.db" >&2
            exit 1
          fi

      - name: Download shard stores
        uses: actions/download-artifact@v5
        with:
          pattern: card-store-shard-*
          path: shards
          merge-multiple: true

      - name: Merge stores
        env:
          FULL_NHL: ${{ needs.plan.outputs.full_nhl }}
        run: |
          mkdir -p .player-cards-data
          shopt -s nullglob
          shards=(shards/card_store_*.db shards/*/card_store_*.db)
          found=()
          for f in "${shards[@]}"; do
            [ -f "$f" ] && found+=("$f")
          done
          if [ "${#found[@]}" -eq 0 ]; then
            echo "No shard databases found" >&2
            exit 1
          fi
          BASE_ARGS=()
          if [ "$FULL_NHL" != "true" ]; then
            if [ ! -f .player-cards-data/card_store.prev.db ]; then
              echo "ERROR: incremental merge refused without base store (would publish partial DB)" >&2
              exit 1
            fi
            echo "Incremental merge onto previous store"
            BASE_ARGS=(--base .player-cards-data/card_store.prev.db)
          fi
          python3 scripts/merge_card_stores.py \
            --out .player-cards-data/card_store.db \
            "${BASE_ARGS[@]}" \
            "${found[@]}"
          cp .player-cards-data/card_store.db .player-cards-data/card_store.prev.db

      - name: Report merged store coverage
        env:
          FULL_NHL: ${{ needs.plan.outputs.full_nhl }}
          INCLUDE_PWHL: ${{ needs.check.outputs.include_pwhl }}
        run: |
          python3 - <<'PY'
          import os, sqlite3, sys
          con = sqlite3.connect(".player-cards-data/card_store.db")
          teams = con.execute(
              "SELECT league, COUNT(DISTINCT team) FROM team_builds GROUP BY league"
          ).fetchall()
          players = con.execute("SELECT COUNT(*) FROM player_profiles").fetchone()[0]
          present = con.execute(
              "SELECT league, team FROM team_builds ORDER BY league, team"
          ).fetchall()
          by = {str(league): int(n) for league, n in teams}
          print("Merged card store:")
          for league, n in teams:
              print(f"  {league}: {n} teams")
          print(f"  player profiles: {players}")
          present_nhl = {t for lg, t in present if lg == "nhl"}
          present_pwhl = {t for lg, t in present if lg == "pwhl"}
          expected_nhl = {
              "ANA","BOS","BUF","CAR","CBJ","CGY","CHI","COL",
              "DAL","DET","EDM","FLA","LAK","MIN","MTL","NJD",
              "NSH","NYI","NYR","OTT","PHI","PIT","SEA","SJS",
              "STL","TBL","TOR","UTA","VAN","VGK","WPG","WSH",
          }
          expected_pwhl = {"BPF","MNF","MVL","NYS","OTC","TSR"}
          missing_nhl = sorted(expected_nhl - present_nhl)
          missing_pwhl = sorted(expected_pwhl - present_pwhl)
          if missing_nhl:
              print(f"  MISSING NHL teams: {', '.join(missing_nhl)}")
          if missing_pwhl:
              print(f"  MISSING PWHL teams: {', '.join(missing_pwhl)}")
          nhl, pwhl = by.get("nhl", 0), by.get("pwhl", 0)
          full_nhl = os.environ.get("FULL_NHL") == "true"
          include_pwhl = os.environ.get("INCLUDE_PWHL") == "true"
          # Incremental runs keep prior teams via --base; only enforce full
          # coverage when this run rebuilt the entire NHL (or PWHL is active).
          if full_nhl and nhl < 32:
              print(f"ERROR: expected 32 NHL teams, got nhl={nhl}", file=sys.stderr)
              sys.exit(1)
          if include_pwhl and pwhl < 6:
              print(f"ERROR: expected 6 PWHL teams, got pwhl={pwhl}", file=sys.stderr)
              sys.exit(1)
          if players < 1:
              print("ERROR: merged store has no player profiles", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload merged card store
        uses: actions/upload-artifact@v5
        with:
          name: card-store-merged
          if-no-files-found: error
          retention-days: 90
          path: .player-cards-data/card_store.db

      - name: Persist merged store for next incremental run
        uses: actions/cache/save@v5
        with:
          path: .player-cards-data/card_store.prev.db
          key: player-cards-merged-${{ github.run_id }}

  record-fingerprint:
    needs: [check, merge]
    if: needs.check.outputs.should_build == 'true' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download live fingerprint
        uses: actions/download-artifact@v5
        with:
          name: live-data-fingerprint
          path: .ci

      - name: Canonicalize fingerprint path
        run: |
          mkdir -p .ci
          cp .ci/live-fingerprint.json .ci/data-fingerprint.json
          echo "Persisting fingerprint:"
          cat .ci/data-fingerprint.json

      - name: Persist fingerprint for next scheduled run
        uses: actions/cache/save@v5
        with:
          path: .ci/data-fingerprint.json
          key: player-cards-data-fp-${{ github.run_id }}

      - name: Upload data fingerprint artifact
        uses: actions/upload-artifact@v5
        with:
          name: data-fingerprint
          path: .ci/data-fingerprint.json
          retention-days: 90

  line-chemistry:
    needs: [check, plan, build-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: needs.check.outputs.should_build == 'true' && needs.plan.outputs.full_build == 'true' && needs.build-shard.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/line_chemistry_passing_networks/requirements.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/line_chemistry_passing_networks/requirements.txt

      - name: Download PBP cache shards
        uses: actions/download-artifact@v5
        with:
          pattern: pbp-cache-shard-*
          path: pbp-shards
          merge-multiple: true

      - name: Unpack PBP into work root
        id: unpack
        env:
          PLAYER_CARDS_WORK_ROOT: ${{ github.workspace }}/.player-cards-data
          FULL_NHL: ${{ needs.plan.outputs.full_nhl }}
        run: |
          mkdir -p "$PLAYER_CARDS_WORK_ROOT"
          shopt -s nullglob
          archives=(pbp-shards/pbp-cache-shard-*.tar.gz pbp-shards/*/pbp-cache-shard-*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No pbp-cache-shard-*.tar.gz artifacts (incremental/empty) — skip line chemistry"
            echo "run_analysis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for arc in "${archives[@]}"; do
            echo "Unpacking $arc"
            tar -xzf "$arc" -C "$PLAYER_CARDS_WORK_ROOT"
          done
          count=$(find "$PLAYER_CARDS_WORK_ROOT" -path '*/Instat_API_Downloads/*_pbp.csv' | wc -l)
          echo "Unpacked $count PBP CSV files"
          if [ "$FULL_NHL" = "true" ] && [ "$count" -lt 500 ]; then
            echo "Expected >=500 NHL PBP CSVs after a full NHL build, got $count" >&2
            exit 1
          fi
          if [ "$count" -lt 1 ]; then
            echo "No PBP CSVs after unpack — skip line chemistry"
            echo "run_analysis=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_analysis=true" >> "$GITHUB_OUTPUT"

      - name: Run line chemistry analysis
        if: steps.unpack.outputs.run_analysis == 'true'
        env:
          PLAYER_CARDS_WORK_ROOT: ${{ github.workspace }}/.player-cards-data
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python research/line_chemistry_passing_networks/analyze_line_chemistry.py

      - name: Upload research outputs
        uses: actions/upload-artifact@v5
        with:
          name: line-chemistry-research
          if-no-files-found: error
          retention-days: 30
          path: research/line_chemistry_passing_networks/outputs/
